<h1>openOODA-tools</h1>
<p>Small command-line tools written in <a href="https://openooda.org">openOODA</a>.</p>
<ul>
<li><a href="oogrep/">oogrep</a> — grep-compatible recursive search, plus JSON output, <code>.gitignore</code>-aware skipping, and an MCP agent surface.</li>
<li><a href="https://github.com/openOODA-tools/oojq">oojq</a> — JSON sorter (98% jq parity).</li>
<li><a href="https://github.com/openOODA-tools/oosh">oosh</a> — shell entry point.</li>
</ul>
